<!DOCTYPE html>
<html>
<head>
    <title>Book Information</title>
</head>
<body>

    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstTitle"></p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor"></p>

    <h2>Book Genres</h2>
    <div id="bookGenres"></div>

    <p id="errorMessage" role="status"></p>

    <script>
        async function loadBooks() {
            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to load books.json");
                }

                const data = await response.json();

                document.getElementById("firstTitle").textContent =
                    data.books[0].title;

                document.getElementById("secondAuthor").textContent =
                    data.books[1].author;

                const genres = document.getElementById("bookGenres");

                data.books.forEach(function(book) {
                    const paragraph = document.createElement("p");

                    paragraph.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genres.appendChild(paragraph);
                });

            } catch (error) {
                document.getElementById("errorMessage").textContent =
                    "Error: Unable to load book information.";
            }
        }

        loadBooks();
    </script>

</body>
</html>
